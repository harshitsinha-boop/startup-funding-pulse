<rect x="181" y="116" width="188" height="84" rx="9" fill="#c9cffa" stroke="#5a63c8" stroke-width="1.6"/>
<text x="275" y="142" text-anchor="middle" font-size="14" font-weight="700" fill="#2b211a">Daily cron, 06:00 IST</text>
<text x="275" y="161" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2b211a">ingest every day; Sunday</text>
<text x="275" y="180" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2b211a">reconciles, Monday briefs</text>
<rect x="181" y="218" width="188" height="84" rx="9" fill="#c9cffa" stroke="#5a63c8" stroke-width="1.6"/>
<text x="275" y="244" text-anchor="middle" font-size="14" font-weight="700" fill="#2b211a">Monday retry, 07:00 IST</text>
<text x="275" y="263" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2b211a">sends the brief only if</text>
<text x="275" y="282" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2b211a">the 06:00 run did not</text>
<rect x="395" y="332" width="188" height="84" rx="9" fill="#bfe6e1" stroke="#2a8f86" stroke-width="1.6"/>
<text x="489" y="358" text-anchor="middle" font-size="14" font-weight="700" fill="#2b211a">Tier 1: Indian media</text>
<text x="489" y="377" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2b211a">Inc42, YourStory, Entrackr,</text>
<text x="489" y="396" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2b211a">ET Tech: RSS + full text</text>
<rect x="395" y="434" width="188" height="84" rx="9" fill="#bfe6e1" stroke="#2a8f86" stroke-width="1.6"/>
<text x="489" y="460" text-anchor="middle" font-size="14" font-weight="700" fill="#2b211a">Tier 2: Google News</text>
<text x="489" y="479" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2b211a">queries built from Aarav's</text>
<text x="489" y="498" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2b211a">sectors + watchlist names</text>
<rect x="609" y="536" width="188" height="84" rx="9" fill="#bfe6e1" stroke="#2a8f86" stroke-width="1.6"/>
<text x="703" y="562" text-anchor="middle" font-size="14" font-weight="700" fill="#2b211a">Tier 3: weekly roundups</text>
<text x="703" y="581" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2b211a">Entrackr report, Inc42 Galore:</text>
<text x="703" y="600" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2b211a">verification, never ingested</text>
<rect x="609" y="650" width="188" height="84" rx="9" fill="#f6e29a" stroke="#b58a00" stroke-width="1.6"/>
<text x="703" y="676" text-anchor="middle" font-size="14" font-weight="700" fill="#2b211a">Config + watchlist</text>
<text x="703" y="695" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2b211a">edited by Aarav in /config,</text>
<text x="703" y="714" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2b211a">applied on the next ingest</text>
<rect x="823" y="650" width="188" height="84" rx="9" fill="#f6e29a" stroke="#b58a00" stroke-width="1.6"/>
<text x="917" y="676" text-anchor="middle" font-size="14" font-weight="700" fill="#2b211a">Pre-filter + enrich</text>
<text x="917" y="695" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2b211a">funding-signal regex, robots-</text>
<text x="917" y="714" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2b211a">aware full text, URL cache</text>
<rect x="823" y="752" width="188" height="84" rx="9" fill="#f6e29a" stroke="#b58a00" stroke-width="1.6"/>
<text x="917" y="778" text-anchor="middle" font-size="14" font-weight="700" fill="#2b211a">Reconcile (Sunday)</text>
<text x="917" y="797" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2b211a">match roundup deals, add the</text>
<text x="917" y="816" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2b211a">missed, coverage % per week</text>
<rect x="1251" y="650" width="188" height="84" rx="9" fill="#f6e29a" stroke="#b58a00" stroke-width="1.6"/>
<text x="1345" y="676" text-anchor="middle" font-size="14" font-weight="700" fill="#2b211a">Normalise + dedupe</text>
<text x="1345" y="695" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2b211a">FX + units in code, IST weeks,</text>
<text x="1345" y="714" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2b211a">name / amount / date merge</text>
<rect x="1251" y="752" width="188" height="84" rx="9" fill="#f6e29a" stroke="#b58a00" stroke-width="1.6"/>
<text x="1345" y="778" text-anchor="middle" font-size="14" font-weight="700" fill="#2b211a">Deals stored + ranked</text>
<text x="1345" y="797" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2b211a">confidence, score vs config,</text>
<text x="1345" y="816" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2b211a">Realtime feed to dashboard</text>
<rect x="1251" y="854" width="188" height="84" rx="9" fill="#f6e29a" stroke="#b58a00" stroke-width="1.6"/>
<text x="1345" y="880" text-anchor="middle" font-size="14" font-weight="700" fill="#2b211a">Brief built + archived</text>
<text x="1345" y="899" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2b211a">stats in code, HTML + text,</text>
<text x="1345" y="918" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2b211a">one stored copy per week</text>
<rect x="1037" y="968" width="188" height="84" rx="9" fill="#c9e8c2" stroke="#3f8f33" stroke-width="1.6"/>
<text x="1131" y="994" text-anchor="middle" font-size="14" font-weight="700" fill="#2b211a">Extraction</text>
<text x="1131" y="1013" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2b211a">structured JSON, temp 0; quotes</text>
<text x="1131" y="1032" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2b211a">must be verbatim; roundups</text>
<rect x="1037" y="1070" width="188" height="84" rx="9" fill="#c9e8c2" stroke="#3f8f33" stroke-width="1.6"/>
<text x="1131" y="1096" text-anchor="middle" font-size="14" font-weight="700" fill="#2b211a">Adjacency + tie-breaks</text>
<text x="1131" y="1115" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2b211a">competitor / adjacent vs the</text>
<text x="1131" y="1134" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2b211a">watchlist; sector; same-deal</text>
<rect x="1037" y="1172" width="188" height="84" rx="9" fill="#c9e8c2" stroke="#3f8f33" stroke-width="1.6"/>
<text x="1131" y="1198" text-anchor="middle" font-size="14" font-weight="700" fill="#2b211a">Pattern narration</text>
<text x="1131" y="1217" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2b211a">numbers computed in code;</text>
<text x="1131" y="1236" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2b211a">ungrounded insights dropped</text>
<rect x="1251" y="1296" width="188" height="84" rx="9" fill="#f7c3cd" stroke="#c2415d" stroke-width="1.6"/>
<text x="1345" y="1322" text-anchor="middle" font-size="14" font-weight="700" fill="#2b211a">Monday digest</text>
<text x="1345" y="1341" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2b211a">HTML + plain text, numbered</text>
<text x="1345" y="1360" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2b211a">sources, watchlist alerts</text>
<rect x="181" y="1424" width="188" height="84" rx="9" fill="#f9d0ae" stroke="#c0661a" stroke-width="1.6"/>
<text x="275" y="1450" text-anchor="middle" font-size="14" font-weight="700" fill="#2b211a">Sets his focus (/config)</text>
<text x="275" y="1469" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2b211a">sectors, stages, cheque range,</text>
<text x="275" y="1488" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2b211a">watchlist, weights; passcode</text>
<rect x="1251" y="1424" width="188" height="84" rx="9" fill="#f9d0ae" stroke="#c0661a" stroke-width="1.6"/>
<text x="1345" y="1450" text-anchor="middle" font-size="14" font-weight="700" fill="#2b211a">Reads brief, explores</text>
<text x="1345" y="1469" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2b211a">inbox before 8 AM; terminal UI,</text>
<text x="1345" y="1488" text-anchor="middle" font-size="11.5" font-weight="400" fill="#2b211a">3D capital map, command bar</text>
<text x="12.0" y="1560" font-size="12" fill="#4a3d33">Accuracy: headlines discover, full articles describe, roundups verify. Gemini never converts currency or computes stats; every quoted evidence sentence is checked as a verbatim substring.</text>
<text x="12.0" y="1580" font-size="12" fill="#4a3d33">Honesty: rumoured deals are excluded from totals; coverage only counts deals with a non-roundup source; week-on-week is shown only when the prior week has 5+ deals. Dashed arrows = data / control flow.</text>
</svg>